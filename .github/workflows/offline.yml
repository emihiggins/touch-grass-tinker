name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # No private-repository runner spending. Emi controls the visibility switch.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Dependency-free tests, saved scoring, isolated package and reproducibility
        # Offline checks must never depend on a corporate proxy's localhost policy.
        env:
          http_proxy: http://127.0.0.1:9
          no_proxy: ''
        run: python scripts/check_release.py
  windows-package:
    # Validate the batch helper when Emi makes the repository public.
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify extracted Windows demo and launcher exit codes
        run: python scripts/package_demo.py
